name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}, ESLint ${{ matrix.eslint }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 10
        run: npm install --no-save --ignore-scripts eslint@${{ matrix.eslint }} @eslint/js@${{ matrix.eslint }}
      - run: npm test

  check:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run ts
      - run: npm run build
